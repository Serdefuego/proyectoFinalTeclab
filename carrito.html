<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | SeniorMusicas</title>

    <link rel="stylesheet" href="css/carrito.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

    <header>

        <a href="index.html" class="volver">
            <i class="fa-solid fa-arrow-left"></i>
            Volver a la tienda
        </a>

        <h1>Mi Carrito</h1>

    </header>


    <main>

        <!-- PRODUCTOS DEL CARRITO -->

        <section id="contenedorCarrito">

            <!-- JavaScript los va a cargar acá -->

        </section>


        <!-- RESUMEN -->

        <aside class="resumen">

            <h2>Resumen de compra</h2>

            <div class="linea">

                <span>Total</span>

                <strong id="total">$0</strong>

            </div>

            <button id="vaciar">
                Vaciar carrito
            </button>

            <button id="comprar">
                Finalizar compra
            </button>

        </aside>

    </main>


<script src="js/carrito.js?v=4"></script>

</body>

</html>
