<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | SeniorMusicas</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- CSS GENERAL -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            <a href="index.html">

                <img
                    src="assets/img/logo.jpg"
                    alt="SeniorMusicas">

            </a>

        </div>


        <nav>

            <ul>

                <li>
                    <a href="index.html">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="index.html#productos">
                        Catálogo
                    </a>
                </li>

                <li>
                    <a href="index.html#categorias">
                        Categorías
                    </a>
                </li>

                <li>
                    <a href="index.html#contacto">
                        Contacto
                    </a>
                </li>

            </ul>

        </nav>


        <div class="icons">

            <a
                href="carrito.html"
                class="carrito-icono">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contadorCarrito">
                    0
                </span>

            </a>


            <a
                href="login.html"
                class="usuario-icono">

                <i class="fa-solid fa-user"></i>

            </a>

        </div>

    </header>


    <!-- LOGIN -->

    <main class="auth-contenedor">

        <section class="auth-card">


            <div class="auth-icono">

                <i class="fa-solid fa-user"></i>

            </div>


            <h1>
                Iniciar sesión
            </h1>


            <p class="auth-subtitulo">

                Ingresá a tu cuenta para acceder a tus recursos musicales.

            </p>


            <form id="formLogin">


                <!-- EMAIL -->

                <div class="form-grupo">

                    <label for="loginEmail">

                        Correo electrónico

                    </label>


                    <div class="input-con-icono">

                        <i class="fa-solid fa-envelope"></i>


                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="ejemplo@email.com"
                            required>

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-grupo">

                    <label for="loginPassword">

                        Contraseña

                    </label>


                    <div class="input-con-icono">

                        <i class="fa-solid fa-lock"></i>


                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Ingresá tu contraseña"
                            required>

                    </div>

                </div>


                <!-- MENSAJES -->

                <p
                    id="mensajeLogin"
                    class="mensaje-form">
                </p>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-auth">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Iniciar sesión

                </button>

            </form>


            <div class="auth-footer">

                <p>

                    ¿Todavía no tenés una cuenta?

                    <a href="registro.html">

                        Crear cuenta

                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
