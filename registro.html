<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | SeniorMusicas</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- CSS general -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            <a href="index.html">
                <img src="assets/img/logo.jpg" alt="SeniorMusicas">
            </a>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#productos">Catálogo</a></li>
                <li><a href="index.html#categorias">Categorías</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
        </nav>

        <div class="icons">

            <a href="carrito.html" class="carrito-icono">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contadorCarrito">0</span>

            </a>

            <a href="login.html" class="usuario-icono">
                <i class="fa-solid fa-user"></i>
            </a>

        </div>

    </header>


    <!-- REGISTRO -->

    <main class="auth-contenedor">

        <section class="auth-card">

            <div class="auth-icono">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Crear cuenta</h1>

            <p class="auth-subtitulo">
                Registrate para comprar y acceder a tus recursos musicales.
            </p>


            <form id="formRegistro">

                <!-- NOMBRE -->

                <div class="form-grupo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <div class="input-con-icono">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Ingresá tu nombre"
                            required>

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-grupo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <div class="input-con-icono">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="ejemplo@email.com"
                            required>

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-grupo">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-con-icono">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresá una contraseña"
                            minlength="6"
                            required>

                    </div>

                </div>


                <!-- REPETIR CONTRASEÑA -->

                <div class="form-grupo">

                    <label for="confirmarPassword">
                        Repetir contraseña
                    </label>

                    <div class="input-con-icono">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmarPassword"
                            placeholder="Repetí tu contraseña"
                            minlength="6"
                            required>

                    </div>

                </div>


                <!-- MENSAJE -->

                <p id="mensajeRegistro" class="mensaje-form"></p>


                <!-- BOTÓN -->

                <button type="submit" class="btn-auth">

                    <i class="fa-solid fa-user-plus"></i>

                    Crear cuenta

                </button>

            </form>


            <div class="auth-footer">

                <p>
                    ¿Ya tenés una cuenta?

                    <a href="login.html">
                        Iniciar sesión
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
